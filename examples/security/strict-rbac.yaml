# Strict RBAC reference profile for the stock Stellar-K8s `run` command.
#
# Assumptions:
#   * operator namespace: stellar-system
#   * managed workload namespace: stellar
#   * operator ServiceAccount: stellar-operator
#   * operator started with --watch-namespace=stellar
#   * mTLS, scheduled snapshots, VPA and benchmark execution are disabled unless
#     their separately reviewed extension permissions are added.
#
# The stock binary still performs a small amount of cluster-wide observation
# from startup/background workers. Those permissions are isolated in the
# read-only runtime-observer ClusterRole below; no cluster-wide writes are granted.
---
apiVersion: v1
kind: Namespace
metadata:
  name: stellar-system
  labels:
    # The stock Helm operator pod is not asserted here to satisfy restricted PSS.
    # Audit/warn surfaces violations without blocking operator startup.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: stellar
  labels:
    # Change this to mainnet/futurenet/custom-* when appropriate.
    stellar.org/network: testnet
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-operator
  namespace: stellar-system
---
# Primary StellarNode reconciliation is namespace-scoped. There are deliberately
# no RBAC wildcards and no write verbs for Secret resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stellar-operator-managed
  namespace: stellar
rules:
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes/finalizers"]
    verbs: ["update"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "update", "patch"]

  # Validator seed values remain owned by Kubernetes/ESO/Vault/CSI.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # `delete_vpa()` runs when vpaConfig is absent if the VPA CRD is installed.
  # Patch enables the opt-in VPA path; delete is required by the default cleanup path.
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "patch", "delete"]

  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stellar-operator-managed
  namespace: stellar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stellar-operator-managed
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system
---
# Startup preflight, feature-flag watching, peer ConfigMap publication and leader
# election all operate in the operator namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stellar-operator-runtime
  namespace: stellar-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stellar-operator-runtime
  namespace: stellar-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stellar-operator-runtime
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system
---
# Stock-binary limitation: run_operator() unconditionally starts preflight,
# peer-discovery, benchmark watching and the snapshot worker with Api::all().
# This ClusterRole grants only the cross-namespace READS needed for those loops
# to start without 403s. It intentionally does not authorize benchmark or
# snapshot writes outside the managed namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-operator-runtime-observer
rules:
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes"]
    verbs: ["list"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarbenchmarks"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-operator-runtime-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-operator-runtime-observer
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system
---
# Startup preflight must read the operator namespace. PSS/network-isolation logic
# reads and patches the managed namespace. Namespace creation remains denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-operator-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["stellar-system", "stellar"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["stellar"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-operator-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-operator-namespaces
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system
---
# Local-storage auto-detection probes only these two conventional StorageClass
# names. Sites that always set spec.storage.storageClass may omit this pair.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-operator-local-storage-detect
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    resourceNames: ["local-path", "local-storage"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-operator-local-storage-detect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-operator-local-storage-detect
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system
