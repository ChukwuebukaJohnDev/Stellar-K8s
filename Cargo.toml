[package]
name = "stellar-k8s"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "Cloud-Native Kubernetes Operator for Stellar Infrastructure"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
toml = "0.8"
# Glob pattern matching for label propagation filters
glob = "0.3"

# Kubernetes client and operator framework
kube = { version = "0.94", features = ["runtime", "derive", "unstable-runtime", "admission", "client", "ws"] }
kube-runtime = { version = "0.94", features = ["unstable-runtime"] }
k8s-openapi = { version = "0.22", default-features = false, features = [
    "v1_30",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Schema generation for CRDs schemars = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
# Pinned to fix RUSSEC-2026-0009 (stack exhustion DoS); also used transitively
# by rcgen/yasna/x509-parser.
time = { version = "0.3.47", optional = true }
# Pinned to fix RUSSEC-2026-0007; used transitively by many HTTP/async crates.
bytes = { version = "1.11.1", optional = true }

# Zip compression for incident reports
zip = "2"

# Hostname for leader election
hostname = "0.4"

# Regex for log scrubbing patterns
regex = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentemetry = "0.22"

# OpenTelemetry for distributed tracing